<!DOCTYPE html>
<html>
<head>
  <title>Donation Form</title>
</head>
<body>
    <h2>
     Donor Information
    </h2>  
    <table>
        <tr><td><label for="firstname*">First Name*:</label></td>
            <td><input type="text" id="firstname*" name="firstname" required></td>
            </tr>
            <tr><td><label for="lastname*">Last Name*:</label></td>
            <td><input type="text" id="lastname*" name="lastname" required></td>
            </tr>
            <tr><td><label for="company">Company:</label></td>
            <td><input type="text" id="company*" name="company" required></td>
            </tr>
            <tr><td><label for="address 1*">Address 1*:</label></td>
            <td><input type="text" id="address 1*" name="address 1" required></td>
            </tr>
            <tr><td><label for="address 2">Address 2:</label></td>
            <td><input type="text" id="address 2" name="address 2" required></td>
            </tr>
            <tr><td><label for="city*">City*:</label></td>
            <td><input type="text" id="city*" name="city" required></td>
            </tr>
            
        <tr>
            <td>State*</td>
            <td>
                <select>
                    <option>Select a State</option>
                    <option>Alaska</option>
                    <option>Alabama</option>
                    <option>Arizona</option>
                </select>
            </td>
        </tr>
        <tr><td><label for="zipcode*">Zip Code*:</label></td>
            <td><input type="text" id="zipcode*" name="zipcode" required></td>
            </tr>
        <tr>
            <td>Country*</td>
            <td>
                <select>
                    <option>Select a Country</option>
                    <option>United States</option>
                    <option>Canada</option>
                    <option>United Kingdom</option>
                    <option>Australia</option>
                </select>
            </td>
        </tr>
        <tr><td><label for="phone">Phone:</label></td>
            <td><input type="text" id="phone" name="phone" required></td>
            </tr>
            <tr><td><label for="fax">Fax:</label></td>
            <td><input type="text" id="fax" name="fax" required></td>
            </tr>
            <tr><td><label for="email*">E-mail*:</label></td>
            <td><input type="text" id="email*" name="email" required></td>
            </tr>
        <td><label>Donation Amount*</label><br>
            <small>(Check a button or type in your amount)</small></td>
            <td>
                <input type="radio" name="amount" value="none">None
                <input type="radio" name="amount" value="$50">$50
                <input type="radio" name="amount" value="$75">$75
                <input type="radio" name="amount" value="$100">$100
                <input type="radio" name="amount" value="$250">$250
                <input type="radio" name="amount" value="other">Other
            </td>

            <tr>
                        <td></td>
                        <td><label for="otheramount">Other Amount $</label>
                            <input type="number" id="otheramount" name="otheramount">
                        </td>
                    </tr>
                    <tr>
                        <td><label for="donation">Recurring Donation</label><br>
                        <small>(Check if yes)</small></td>
                        <td><input type="checkbox" name="yes">I am interested in giving on a regular basis</td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><label for="creditcard">Monthly Credit Card $</label>
                            <input type="number" id="creditcard" name="creditcard">
                            <label for="for">For</label>
                            <input type="number" id="months" name="months">
                            <label for="months">Months</label>
                        </td>
                    </tr>
                    <tr>
                        <td>
                        <button type="button">Reset</button>
                        <button type="button">Continue</button>
                        </td>
                    </tr>
        
    </table>
</body>
