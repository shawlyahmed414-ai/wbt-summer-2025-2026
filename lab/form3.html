<!DOCTYPE html>
<html lang="en">
    <head>
        <body>
            <div class="form-container">
                <header class="form-header">
                    <h1 class="form-title">Create your account</h1>
                    <p class="form-subtitle">Join us in a couple of steps.</p>
                </header>

                <form class="account-form">
                    <div class="form-group">
                        <label for="full-name" class="form-label">Full name</label>
                        <input type="text" id="full-name" class="form-input" placeholder="Jane Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" id="age" class="form-input" placeholder="28" min="0">
                    </div>

                    <div class="form-group">
                        <label for="dob" class="form-label">Date of birth</label>
                        <input type="text" id="dob" class="form-input" placeholder="25/06/26">
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" id="email" class="form-input" placeholder="jane@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="........" required>
                    </div>

                    <div class="form-group">
                        <span class="form-label">Preferred contact</span>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="peferred-contact" value="email" checked>Email</label>
                              <label class="radio-label">
                                <input type="radio" name="peferred-contact" value="phone">Phone</label>
                                <label class="radio-label">
                                <input type="radio" name="peferred-contact" value="sms">SMS</label>  
                        </div>
                    </div>

                    <div class="card-footer">
                        <button type="submit">Submit</button>
                        &nbsp;&nbsp;&nbsp;
                        <button type="reset">Reset</button>
                    </div>
               
            </div>
        </body>
    </head>
</html>
